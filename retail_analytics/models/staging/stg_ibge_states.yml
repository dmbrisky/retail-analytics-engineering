version: 2

models:
  - name: stg_ibge_states
    description: "Cleaned and flattened Brazilian state and region reference data from the IBGE API."

    columns:
      - name: state_id
        tests:
          - not_null
          - unique

      - name: state_code
        tests:
          - not_null
          - unique

      - name: state_name
        tests:
          - not_null

      - name: region_name
        tests:
          - not_null