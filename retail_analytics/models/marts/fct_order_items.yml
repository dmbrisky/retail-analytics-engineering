version: 2

models:
  - name: fct_order_items
    description: "Order item fact at one row per order item within an order, including product ID, seller ID, order date, and order measures."

    columns:
      - name: order_item_key
        description: "Unique row identifier derived from order_id and order_item_id."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Identifier for the order containing the item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
          
      - name: product_id
        description: "Identifier for the product associated with the order item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: seller_id
        description: "Identifier for the seller associated with the order item."
        data_tests:
          - not_null

      - name: order_date
        description: "Date when the order was placed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
        
      - name: price
        description: "Price associated with the order item."

      - name: freight_value
        description: "Freight associated with the order item."